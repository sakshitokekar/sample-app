# GitHub Actions CI/CD for sample-app.
# Runs on every push and pull request: installs dependencies, runs the
# pytest suite, and builds the Docker image to confirm it's buildable.
# This is the automated verification layer sitting alongside (not
# replacing) Agent 5's AI-driven test analysis and Agent 3's local build —
# CI provides the same checks running on GitHub's own infrastructure,
# independent of any single developer's machine.
name: CI

on:
  push:
    branches: ["main", "agent2/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: python -m pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sample-app:${{ github.sha }} .
